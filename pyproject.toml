[project]
name = "agblearn"
version = "0.1.0"
description = "AI Agent learning experiments following ai-agent-book (bojieli)"
readme = "README.md"
authors = [
    { name = "Dev-Chaozeng", email = "chaozeng.fang@dida.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jieba>=0.42.1",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "openai>=3.13.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
